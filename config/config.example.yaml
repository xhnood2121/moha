# moha config — copy to config/config.yaml and edit.
# See DESIGN.md for the meaning of every knob.

mode: paper           # backtest | paper | live
symbol: BTCUSDT
venue: futures        # futures | spot
margin_mode: isolated # isolated only. cross is refused.

# --- data ---
timeframes:
  fast: 1m
  primary: 5m
  context_mid: 15m
  context_high: 1h

# --- risk (see DESIGN.md §J) ---
risk:
  base_risk_pct: 0.0075       # 0.75%
  min_risk_pct: 0.0050        # floor
  max_risk_pct: 0.0150        # ceiling
  daily_loss_cap_pct: 0.03
  weekly_loss_cap_pct: 0.07
  max_consecutive_losses: 4
  loss_reduce_factor: 0.85    # after each loss
  max_concurrent_positions: 1
  max_daily_trades: 8
  idle_reserve_pct: 0.20
  drawdown_kill_pct: 0.10
  first_live_days: 14         # pilot ramp
  first_live_capital_pct: 0.10
  first_live_max_risk_pct: 0.004

leverage:
  effective_cap: 5.0
  ladder:                     # regime_score -> max eff leverage
    - {min: 0.80, max_lev: 5.0}
    - {min: 0.60, max_lev: 3.5}
    - {min: 0.40, max_lev: 2.0}
    - {min: 0.00, max_lev: 1.0}

# --- strategy (see DESIGN.md §E) ---
strategy:
  momentum:
    lookback_bars: 20
    breakout_pct: 0.001
    volume_mult: 1.8
    min_body_ratio: 0.55
    min_adx_15m: 18
    tp1_r: 1.0
    tp2_r: 2.5
    tp1_close_frac: 0.5
    trail_atr_mult: 1.5
    time_stop_bars: 12         # 5m bars
    min_rr: 1.8
  pullback:
    fib_low: 0.38
    fib_high: 0.61
    tp1_r: 1.0
    tp2_r: 2.0
    tp1_close_frac: 0.6
    trail_atr_mult: 2.0
    time_stop_bars: 18
    min_rr: 1.5
  expansion:
    bbwidth_pctile: 0.20
    bbwidth_window: 40
    compressed_bars_needed: 6
    lookback_compressed: 10
    volume_mult: 1.5
    min_body_ratio: 0.6
    tp1_r: 1.5
    tp2_r: 3.0
    tp1_close_frac: 0.5
    trail_atr_mult: 2.0
    time_stop_bars: 24
    min_rr: 2.0

# --- filters (see DESIGN.md §F) ---
filters:
  spread_mult: 3.0
  book_depth_levels: 20
  book_wall_mult: 3.0
  news_atr_mult: 2.0
  round_number: 1000
  round_number_pct: 0.001
  session_thresholds:
    high_activity_utc: [7, 21]    # [start, end)
    strong_hours_score: 0.55
    off_hours_score: 0.75
  weekend_risk_scale: 0.5
  taker_pressure_min: 0.55
  funding_skip_window_min: 5
  funding_skip_threshold_pct: 0.0005
  oi_delta_pct: 0.05
  oi_price_pct: 0.002
  cooldown_bars_5m: 3

# --- exchange ---
exchange:
  base_rest_futures: https://fapi.binance.com
  base_ws_futures: wss://fstream.binance.com/ws
  base_rest_spot: https://api.binance.com
  base_ws_spot: wss://stream.binance.com/ws
  recv_window_ms: 5000
  rest_max_weight_per_min: 2400
  orders_per_10s: 300
  ws_reconnect_max_delay_s: 30

# --- persistence ---
journal:
  path: ./data/moha.sqlite

# --- alerts ---
alerts:
  telegram_enabled: false
  telegram_chat_id: ""
  # token comes from env

# --- backtest ---
backtest:
  slippage_ticks: 1
  slippage_k_atr: 0.15
  taker_fee_bps: 4.5     # 0.045%
  maker_fee_bps: 1.8
  funding_apply: true
